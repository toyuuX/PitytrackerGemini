  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gt: {
              bg: 'var(--bg-main, #0A0F23)',
              sec: 'var(--bg-sec, #0E1530)',
              card: 'var(--bg-card, #131B3B)',
              raised: 'var(--bg-raised, #1A2448)',
              border: 'var(--border-color, #2B3766)',
              gold: 'var(--accent-gold, #F0C36A)',
              warmGold: 'var(--accent-warm, #FFB259)',
              text: 'var(--text-main, #E9EDFF)',
              subtext: 'var(--text-sub, #AEB7DC)',
              r5: '#F3B942',
              r4: '#A974F2',
              r3: '#5AA0F2',
              pyro: '#FF6640',
              hydro: '#33CCFF',
              anemo: '#00FF99',
              electro: '#CC80FF',
              dendro: '#A6E92D',
              cryo: '#99FFFF',
              geo: '#FFB300'

            nunito: ['Nunito', 'sans-serif'],

  <style>
    :root {
      --bg-main: #0A0F23;
      --bg-sec: #0E1530;
      --bg-card: #131B3B;
      --bg-raised: #1A2448;
      --border-color: #2B3766;
      --accent-gold: #F0C36A;
      --accent-warm: #FFB259;
      --text-main: #E9EDFF;
      --text-sub: #AEB7DC;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Roboto', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .font-heading { font-family: 'Nunito', sans-serif; }
    .font-genshin { font-family: 'Marcellus', serif; }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0A0F23; }
    ::-webkit-scrollbar-thumb { background: #2B3766; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #F0C36A; }

    /* Animations */
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-bounceSlow { animation: bounce 3s infinite; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glow effects */
    .glow-gold { box-shadow: 0 0 15px rgba(240, 195, 106, 0.25); }
    .glow-purple { box-shadow: 0 0 15px rgba(169, 116, 242, 0.25); }
    .text-gradient-gold {
      background: linear-gradient(135deg, #FFF0CA 0%, #F0C36A 50%, #FFB259 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Range input styling */
    input[type=range] {
      accent-color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <!-- Main Application Logic -->
  <script type="text/babel">

      { id: 'sac_sword', name: 'Sacrificial Sword', rarity: 4, type: 'Sword' }
    ];

    const DOMAIN_SCHEDULE = {
      1: { name: 'Monday', talents: ['Freedom', 'Prosperity', 'Transience', 'Admonition', 'Equity', 'Contention'], weapons: ['Decarabian', 'Guyun', 'Distant Sea', 'Copper', 'Mechanical'] },
      2: { name: 'Tuesday', talents: ['Resistance', 'Diligence', 'Elegant', 'Ingenuity', 'Justice', 'Kindling'], weapons: ['Boreal Wolf', 'Mist Veiled', 'Narukami', 'Oasis Garden', 'Pure Sacred'] },

      4: { name: 'Thursday', talents: ['Freedom', 'Prosperity', 'Transience', 'Admonition', 'Equity', 'Contention'], weapons: ['Decarabian', 'Guyun', 'Distant Sea', 'Copper', 'Mechanical'] },
      5: { name: 'Friday', talents: ['Resistance', 'Diligence', 'Elegant', 'Ingenuity', 'Justice', 'Kindling'], weapons: ['Boreal Wolf', 'Mist Veiled', 'Narukami', 'Oasis Garden', 'Pure Sacred'] },
      6: { name: 'Saturday', talents: ['Ballad', 'Gold', 'Light', 'Praxis', 'Order', 'Conflict'], weapons: ['Dandelion Gladiator', 'Aerosiderite', 'Mask', 'Scorching Sun', 'Ancient Chord'] },
      0: { name: 'Sunday', talents: ['All Materials Open'], weapons: ['All Materials Open'] }
    };

    // --- DEFAULT APPLICATION STATE ---
    const INITIAL_STATE = {
      version: 2,
      settings: {
        theme: 'dark',
        styleMode: 'genshin',
        accentColor: 'gold',
        customAccentHex: '#F0C36A',
        savingsDisplay: 'split',
        bannerArt: true,
        chronicledWishEnabled: true,
        region: 'America',
        welkinActive: true,
        visibleTabs: ['home', 'pity', 'history', 'planner', 'materials', 'todo', 'characters', 'wishlist'],
        homeWidgets: ['pitySummary', 'resinStatus', 'todoOverview', 'domainSchedule', 'primogemSavings', 'wishlistSummary']
      },
      pity: {
        character: { count: 32, guaranteed: false, totalWishes: 124, lastFiveStar: 'Neuvillette' },
        weapon: { count: 14, guaranteed: false, fatePoints: 0, totalWishes: 45, targetWeapon: 'Splendor of Tranquil Waters' },
        standard: { count: 58, totalWishes: 198 },
        chronicled: { count: 6, guaranteed: false, totalWishes: 12 }
      },
      savings: {
        primogems: 14200,
        fatesIntertwined: 18,
        fatesAcquaint: 6
      },
      resin: {
        current: 138,
        max: 200,
        lastUpdated: Date.now()
      },
      history: [
        { id: '1', banner: 'character', item: 'Neuvillette', rarity: 5, pity: 78, date: '2026-09-15' },
        { id: '2', banner: 'character', item: 'Kachina', rarity: 4, pity: 8, date: '2026-09-15' },
        { id: '3', banner: 'weapon', item: 'Staff of Homa', rarity: 5, pity: 64, date: '2026-08-20' },
        { id: '4', banner: 'standard', item: 'Mona', rarity: 5, pity: 75, date: '2026-07-10' }
      ],
      wishlist: [
        { id: 'w1', name: 'Skirk', type: 'character', banner: 'character', goal: 'C0', priority: 1, wishBudget: 180 },
        { id: 'w2', name: 'Escoffier', type: 'character', banner: 'character', goal: 'C0', priority: 2, wishBudget: 90 },
        { id: 'w3', name: 'Splendor of Tranquil Waters', type: 'weapon', banner: 'weapon', goal: 'R1', priority: 3, wishBudget: 160 }
      ],
      todo: [
        { id: 't1', title: 'Farm Equity Talent Books for Fontaine characters', category: 'Domain', completed: false, priority: 'high' },
        { id: 't2', title: 'Defeat Weekly Boss: All-Devouring Narwhal', category: 'Boss', completed: false, priority: 'medium' },
        { id: 't3', title: 'Complete Daily Commissions (60 Primogems)', category: 'Daily', completed: true, priority: 'high' }
      ],
      characterProgress: {
        skirk: { owned: false, constellation: 0, level: 1 },
        neuvillette: { owned: true, constellation: 1, level: 90 },
        furina: { owned: true, constellation: 2, level: 90 },
        zhongli: { owned: true, constellation: 0, level: 90 }
      }
    };

    // --- HELPER COMPONENT FOR IMAGE FALLBACKS ---
    function CharacterIcon({ character, className = "w-12 h-12", showRarity = true }) {
      const [imgError, setImgError] = useState(false);
      
      const elementColors = {
        pyro: '#FF6640', hydro: '#33CCFF', anemo: '#00FF99',
        electro: '#CC80FF', dendro: '#A6E92D', cryo: '#99FFFF', geo: '#FFB300'
      };

      const rarityBg = character?.rarity === 5 
        ? 'bg-gradient-to-b from-[#A27137] to-[#F3B942]' 
        : 'bg-gradient-to-b from-[#56437B] to-[#A974F2]';

      const elementColor = elementColors[character?.element?.toLowerCase()] || '#F0C36A';

      if (!character) return <div className={`${className} bg-gt-raised rounded-xl`}></div>;

      return (
        <div className={`relative rounded-xl overflow-hidden shadow-md flex-shrink-0 ${rarityBg} ${className}`}>
          {!imgError && character.icon ? (
            <img 
              src={character.icon} 
              alt={character.name} 
              className="w-full h-full object-cover rounded-xl" 
              onError={() => setImgError(true)} 
              loading="lazy"
            />
          ) : (
            <div className="w-full h-full flex flex-col items-center justify-center p-1 text-center bg-gt-raised">
              <div className="w-3 h-3 rounded-full mb-1 shadow-sm" style={{ backgroundColor: elementColor }}></div>
              <span className="text-[10px] font-bold leading-tight line-clamp-2 text-gt-text">{character.name}</span>
            </div>
          )}
          {showRarity && (
            <div className="absolute bottom-0 inset-x-0 bg-black/60 text-[9px] text-center font-bold text-gt-gold py-[1px]">
              {character.rarity}★
            </div>
          )}
        </div>
      );
    }

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      // LocalStorage State Initialization
      const [appData, setAppData] = useState(() => {
        try {
          const saved = localStorage.getItem('genshin_track_v2_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            return { ...INITIAL_STATE, ...parsed };
          }
        } catch (e) {
          console.error("Failed to load saved state", e);
        }
        return INITIAL_STATE;
      });

      const [activeTab, setActiveTab] = useState('pity');
      const [searchQuery, setSearchQuery] = useState('');
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [logModalBanner, setLogModalBanner] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [lastStateHistory, setLastStateHistory] = useState([]);

      // Auto-save mutation
      useEffect(() => {
        try {
          localStorage.setItem('genshin_track_v2_data', JSON.stringify(appData));
        } catch (e) {
          console.error("Failed to save data", e);
        }
      }, [appData]);

      // Resin regeneration calculation logic
      useEffect(() => {
        const interval = setInterval(() => {
          setAppData(prev => {
            const now = Date.now();
            const elapsedMs = now - prev.resin.lastUpdated;
            const resinToAdd = Math.floor(elapsedMs / (8 * 60 * 1000));
            if (resinToAdd > 0 && prev.resin.current < prev.resin.max) {
              const newResin = Math.min(prev.resin.max, prev.resin.current + resinToAdd);
              return {
                ...prev,
                resin: {
                  ...prev.resin,
                  current: newResin,
                  lastUpdated: now
                }
              };
            }
            return prev;
          });
        }, 30000); // Check every 30s
        return () => clearInterval(interval);
      }, []);

      // Toast notification trigger
      const showToast = useCallback((msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      }, []);

      // Helper for saving undo state
      const mutateState = useCallback((updater, toastText) => {
        setAppData(prev => {
          setLastStateHistory(h => [JSON.parse(JSON.stringify(prev)), ...h.slice(0, 5)]);
          const next = updater(prev);
          return next;
        });
        if (toastText) showToast(toastText);
      }, [showToast]);

      const handleUndo = useCallback(() => {
        if (lastStateHistory.length === 0) return;
        const previous = lastStateHistory[0];
        setAppData(previous);
        setLastStateHistory(h => h.slice(1));
        showToast("Action Undone!");
      }, [lastStateHistory, showToast]);

      // Calculation values
      const totalPrimogemsSpent = useMemo(() => {
        let count = 0;
        Object.values(appData.pity).forEach(b => {
          count += (b.totalWishes || 0) * 160;
        });
        return count;
      }, [appData.pity]);

      const totalWishesSpent = useMemo(() => {
        return Math.floor(totalPrimogemsSpent / 160);
      }, [totalPrimogemsSpent]);

      // --- RENDER METHODS FOR EACH TAB ---

      // 1. HOME DASHBOARD TAB
      const renderHomeTab = () => (
        <div className="space-y-5 animate-slideUp">
          <div className="flex items-center justify-between">
            <h2 className="text-2xl font-bold font-heading text-gt-gold">Traveler Dashboard</h2>
            <button 
              onClick={() => setActiveTab('settings')}
              className="px-3 py-1.5 bg-gt-card border border-gt-border hover:border-gt-gold rounded-xl text-xs font-semibold text-gt-subtext hover:text-gt-text transition flex items-center gap-1.5"
            >
              ⚙️ Custom Layout
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {/* Widget: Pity Summary */}
            <div className="bg-gt-card border border-gt-border rounded-2xl p-4 shadow-lg hover:border-gt-gold/50 transition">
              <div className="flex justify-between items-center mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-gt-gold">✨ Pity Counters</span>
                <button onClick={() => setActiveTab('pity')} className="text-xs text-gt-warmGold hover:underline font-bold">View All →</button>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-gt-raised p-3 rounded-xl border border-gt-border/50">
                  <div className="text-[11px] text-gt-subtext font-bold">Character Wish</div>
                  <div className="text-2xl font-extrabold text-gt-gold my-0.5">{appData.pity.character.count} <span className="text-xs text-gt-subtext font-normal">/ 90</span></div>
                  <div className="text-[10px] text-gt-subtext flex justify-between">
                    <span>{appData.pity.character.guaranteed ? "Guaranteed 5★" : "50/50 Status"}</span>
                    <span className="text-gt-gold font-bold">{appData.pity.character.count >= 74 ? "Soft Pity!" : "Normal"}</span>
                  </div>
                </div>
                <div className="bg-gt-raised p-3 rounded-xl border border-gt-border/50">
                  <div className="text-[11px] text-gt-subtext font-bold">Weapon Wish</div>
                  <div className="text-2xl font-extrabold text-gt-warmGold my-0.5">{appData.pity.weapon.count} <span className="text-xs text-gt-subtext font-normal">/ 80</span></div>
                  <div className="text-[10px] text-gt-subtext flex justify-between">
                    <span>Fate Pts: {appData.pity.weapon.fatePoints || 0}/1</span>
                    <span className="text-gt-warmGold font-bold">{appData.pity.weapon.count >= 63 ? "Soft Pity!" : "Normal"}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Widget: Resin Status */}
            <div className="bg-gt-card border border-gt-border rounded-2xl p-4 shadow-lg hover:border-gt-gold/50 transition">
              <div className="flex justify-between items-center mb-3">
                <span className="text-xs font-bold uppercase tracking-wider text-gt-gold">🌙 Resin Overview</span>
                <button onClick={() => setActiveTab('materials')} className="text-xs text-gt-warmGold hover:underline font-bold">Manage →</button>
              </div>
              <div className="flex items-center gap-4">
                <div className="relative w-16 h-16 flex-shrink-0 flex items-center justify-center">
                  <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path className="text-gt-raised stroke-current" strokeWidth="4" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path className="text-gt-hydro stroke-current" strokeDasharray={`${(appData.resin.current / appData.resin.max) * 100}, 100`} strokeWidth="4" strokeLinecap="round" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                  </svg>
                  <span className="absolute font-extrabold text-sm text-gt-text">{appData.resin.current}</span>
                </div>
                <div className="flex-1">
                  <div className="text-xs font-semibold text-gt-subtext mb-1">
                    {appData.resin.current >= 200 ? "Resin Full!" : `Full in ~${Math.ceil((200 - appData.resin.current) * 8 / 60)} hrs`}
                  </div>
                  <div className="flex gap-2 mt-2">
                    <button 
                      onClick={() => mutateState(p => ({ ...p, resin: { ...p.resin, current: Math.max(0, p.resin.current - 20) } }), "Spent 20 Resin")}
                      className="px-2.5 py-1 bg-gt-raised border border-gt-border rounded-lg text-xs font-bold text-gt-subtext hover:text-gt-gold transition"
                    >
                      -20
                    </button>
                    <button 
                      onClick={() => mutateState(p => ({ ...p, resin: { ...p.resin, current: Math.max(0, p.resin.current - 40) } }), "Spent 40 Resin")}
                      className="px-2.5 py-1 bg-gt-raised border border-gt-border rounded-lg text-xs font-bold text-gt-subtext hover:text-gt-gold transition"
                    >
                      -40 Condensed
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* Widget: Farmable Domains Today */}
            <div className="bg-gt-card border border-gt-border rounded-2xl p-4 shadow-lg hover:border-gt-gold/50 transition">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-bold uppercase tracking-wider text-gt-gold">⚔️ Today's Domain Schedule</span>
                <span className="text-[11px] text-gt-subtext font-semibold">{DOMAIN_SCHEDULE[new Date().getDay()].name}</span>

                <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                  <button 
                    onClick={() => mutateState(p => ({ ...p, resin: { ...p.resin, current: Math.min(200, p.resin.current + 60) } }), "Added 60 Resin (Fragile)")}
                    className="px-3 py-2 bg-gt-raised border border-gt-border hover:border-gt-gold rounded-xl text-xs font-bold text-gt-gold transition"
                  >
                    🧪 +60 Fragile
                  </button>
                  <button 
                    onClick={() => mutateState(p => ({ ...p, resin: { ...p.resin, current: 200 } }), "Resin Set to 200")}
                    className="px-3 py-2 bg-gt-raised border border-gt-border hover:border-gt-gold rounded-xl text-xs font-bold text-gt-subtext transition"
                  >
                    Max
                  </button>
                </div>
              </div>
            </div>

            {/* Today's Domain Schedule */}
            <div className="bg-gt-card border border-gt-border rounded-2xl p-5 shadow-lg space-y-3">
              <div className="flex justify-between items-center">
                <h3 className="text-base font-extrabold text-gt-gold">⚔️ Today's Farmable Materials ({todaySchedule.name})</h3>
                <span className="text-xs px-2.5 py-1 bg-gt-raised rounded-full text-gt-subtext border border-gt-border font-bold">Server Day</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-gt-raised p-4 rounded-xl border border-gt-border/50">
                  <div className="text-xs font-bold text-gt-warmGold uppercase mb-2">Talent Level-Up Books</div>
                  <div className="flex flex-wrap gap-2">
                    {todaySchedule.talents.map((t, idx) => (
                      <span key={idx} className="px-2.5 py-1 bg-gt-card border border-gt-border rounded-lg text-xs font-bold text-gt-text">
                        {t}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="bg-gt-raised p-4 rounded-xl border border-gt-border/50">
                  <div className="text-xs font-bold text-gt-hydro uppercase mb-2">Weapon Ascension Materials</div>
                  <div className="flex flex-wrap gap-2">
                    {todaySchedule.weapons.map((w, idx) => (
                      <span key={idx} className="px-2.5 py-1 bg-gt-card border border-gt-border rounded-lg text-xs font-bold text-gt-text">
                        {w}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // 6. TO-DO CHECKLIST TAB
      const renderTodoTab = () => {
        const [newTaskTitle, setNewTaskTitle] = useState('');
        const [newTaskCategory, setNewTaskCategory] = useState('Daily');

        const handleAddTask = (e) => {
          e.preventDefault();
          if (!newTaskTitle.trim()) return;
          mutateState(p => ({
            ...p,
            todo: [
              ...p.todo,
              { id: Date.now().toString(), title: newTaskTitle.trim(), category: newTaskCategory, completed: false, priority: 'medium' }
            ]
          }), "Task Added");
          setNewTaskTitle('');
        };

        return (
          <div className="space-y-5 animate-slideUp">
            <h2 className="text-2xl font-bold font-heading text-gt-gold">Genshin Companion To-Do List</h2>

            {/* Quick Add Form */}
            <form onSubmit={handleAddTask} className="flex gap-2">
              <input 
                type="text" 
                placeholder="Add a new task (e.g. Farm Artifacts, Weekly Bosses)..."
                value={newTaskTitle}
                onChange={e => setNewTaskTitle(e.target.value)}
                className="flex-1 bg-gt-card border border-gt-border rounded-xl px-4 py-2.5 text-xs font-bold text-gt-text focus:outline-none focus:border-gt-gold"
              />
              <select 
                value={newTaskCategory}
                onChange={e => setNewTaskCategory(e.target.value)}
                className="bg-gt-card border border-gt-border rounded-xl px-3 py-2.5 text-xs font-bold text-gt-subtext focus:outline-none"
              >
                <option>Daily</option>
                <option>Domain</option>
                <option>Boss</option>
                <option>Quest</option>
              </select>
              <button 
                type="submit"
                className="px-4 py-2.5 bg-gt-gold text-black rounded-xl text-xs font-extrabold hover:opacity-90 transition"
              >
                + Add
              </button>
            </form>

            {/* Task Checklist */}
            <div className="bg-gt-card border border-gt-border rounded-2xl overflow-hidden shadow-lg divide-y divide-gt-border/50">
              {appData.todo.length === 0 ? (
                <div className="p-8 text-center text-gt-subtext text-xs">No tasks active. Add one above!</div>
              ) : (
                appData.todo.map(task => (
                  <div key={task.id} className="p-3.5 flex items-center justify-between hover:bg-gt-raised/40 transition">
                    <div className="flex items-center gap-3">
                      <input 
                        type="checkbox" 
                        checked={task.completed} 
                        onChange={() => mutateState(p => ({
                          ...p,
                          todo: p.todo.map(t => t.id === task.id ? { ...t, completed: !t.completed } : t)
                        }))}
                        className="w-4 h-4 accent-gt-gold rounded cursor-pointer"
                      />
                      <span className={`text-xs font-bold ${task.completed ? 'line-through text-gt-subtext/60' : 'text-gt-text'}`}>
                        {task.title}
                      </span>
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="px-2 py-0.5 bg-gt-raised border border-gt-border rounded text-[10px] font-bold text-gt-subtext">
                        {task.category}
                      </span>
                      <button 
                        onClick={() => mutateState(p => ({ ...p, todo: p.todo.filter(t => t.id !== task.id) }), "Task Deleted")}
                        className="text-gt-subtext hover:text-red-400 p-1 text-xs"
                      >
                        ✕
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        );
      };

      // 7. CHARACTERS TAB
      const renderCharactersTab = () => {
        const [filterElement, setFilterElement] = useState('all');

        const filtered = CHARACTER_DATABASE.filter(c => {
          if (filterElement !== 'all' && c.element.toLowerCase() !== filterElement) return false;
          return true;
        });

        return (
          <div className="space-y-5 animate-slideUp">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <h2 className="text-2xl font-bold font-heading text-gt-gold">Character Roster</h2>

              {/* Element Filter Buttons */}
              <div className="flex flex-wrap gap-1">
                {['all', 'pyro', 'hydro', 'anemo', 'electro', 'dendro', 'cryo', 'geo'].map(el => (
                  <button 
                    key={el}
                    onClick={() => setFilterElement(el)}
                    className={`px-2.5 py-1 rounded-lg text-xs font-bold capitalize transition ${filterElement === el ? 'bg-gt-gold text-black' : 'bg-gt-card border border-gt-border text-gt-subtext hover:text-gt-text'}`}
                  >
                    {el}
                  </button>
                ))}
              </div>
            </div>

            {/* Character Roster Grid */}
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
              {filtered.map(char => {
                const prog = appData.characterProgress[char.id] || { owned: false, constellation: 0 };
                return (
                  <div key={char.id} className="bg-gt-card border border-gt-border hover:border-gt-gold/50 rounded-2xl p-3 shadow-md transition flex flex-col items-center text-center relative">
                    <CharacterIcon character={char} className="w-16 h-16 my-1" />
                    <div className="text-xs font-extrabold text-gt-text mt-1">{char.name}</div>
                    <div className="text-[10px] font-bold text-gt-subtext capitalize">{char.element} • {char.weapon}</div>

                    <div className="flex items-center gap-2 mt-3 w-full">
                      <button 
                        onClick={() => mutateState(p => ({
                          ...p,
                          characterProgress: {
                            ...p.characterProgress,
                            [char.id]: { ...prog, owned: !prog.owned }
                          }
                        }))}
                        className={`flex-1 py-1 rounded-lg text-[10px] font-extrabold border transition ${prog.owned ? 'bg-gt-gold/20 border-gt-gold text-gt-gold' : 'bg-gt-raised border-gt-border text-gt-subtext'}`}
                      >
                        {prog.owned ? `Owned (C${prog.constellation})` : 'Unowned'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // 8. WISHLIST TAB
      const renderWishlistTab = () => (
        <div className="space-y-5 animate-slideUp">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold font-heading text-gt-gold">Wishlist & Target Goals</h2>
            <button 
              onClick={() => {
                const name = prompt("Target Character/Weapon Name:");
                if (name) {
                  mutateState(p => ({
                    ...p,
                    wishlist: [
                      ...p.wishlist,
                      { id: Date.now().toString(), name, type: 'character', banner: 'character', goal: 'C0', priority: p.wishlist.length + 1, wishBudget: 90 }
                    ]
                  }), "Added to Wishlist");
                }
              }}
              className="px-3 py-1.5 bg-gt-gold text-black rounded-xl text-xs font-extrabold hover:opacity-90 transition"
            >
              + Add Target Goal
            </button>
          </div>

          <div className="space-y-3">
            {appData.wishlist.map(target => (
              <div key={target.id} className="bg-gt-card border border-gt-border rounded-2xl p-4 shadow-lg flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gt-raised border border-gt-gold/40 flex items-center justify-center font-black text-gt-gold text-sm">
                    #{target.priority}
                  </div>
                  <div>
                    <div className="text-sm font-extrabold text-gt-text">{target.name}</div>
                    <div className="text-xs text-gt-subtext">Goal: {target.goal} • Estimated Wish Budget: {target.wishBudget} Wishes</div>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => mutateState(p => ({ ...p, wishlist: p.wishlist.filter(w => w.id !== target.id) }), "Goal Removed")}
                    className="p-2 bg-gt-raised border border-gt-border hover:border-red-400 text-gt-subtext hover:text-red-400 rounded-xl text-xs font-bold transition"
                  >
                    🗑️ Remove
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      // 9. SETTINGS TAB
      const renderSettingsTab = () => (
        <div className="space-y-6 animate-slideUp">
          <h2 className="text-2xl font-bold font-heading text-gt-gold">Application Settings</h2>

          <div className="bg-gt-card border border-gt-border rounded-2xl p-5 shadow-lg space-y-4">
            <h3 className="text-sm font-extrabold text-gt-gold uppercase tracking-wider">Appearance & Options</h3>

            <div className="flex justify-between items-center py-2 border-b border-gt-border/50">
              <div>
                <div className="text-xs font-bold text-gt-text">Enable Chronicled Wish Banner</div>
                <div className="text-[10px] text-gt-subtext">Display Chronicled Wish card in Pity tab</div>
              </div>
              <input 
                type="checkbox" 
                checked={appData.settings.chronicledWishEnabled}
                onChange={e => mutateState(p => ({ ...p, settings: { ...p.settings, chronicledWishEnabled: e.target.checked } }))}
                className="w-4 h-4 accent-gt-gold"
              />
            </div>

            {/* Health Check */}
            <div className="pt-2">
              <button 
                onClick={() => {
                  showToast("Health Check Complete: All Data Structures Valid!");
                }}
                className="px-4 py-2 bg-gt-raised border border-gt-gold text-gt-gold hover:bg-gt-gold hover:text-black rounded-xl text-xs font-extrabold transition"
              >
                🏥 Run Data Diagnostic Health Check
              </button>
            </div>
          </div>
        </div>
      );

      // --- MANUAL PULL LOG MODAL ---
      const renderLogModal = () => {
        if (!logModalBanner) return null;

        const [selectedItem, setSelectedItem] = useState(CHARACTER_DATABASE[0].name);
        const [rarity, setRarity] = useState(5);
        const [pityAtPull, setPityAtPull] = useState(appData.pity[logModalBanner]?.count || 1);

        const handleSave = (e) => {
          e.preventDefault();
          mutateState(p => ({
            ...p,
            pity: {
              ...p.pity,
              [logModalBanner]: {
                ...p.pity[logModalBanner],
                count: rarity === 5 ? 0 : p.pity[logModalBanner].count,
                totalWishes: (p.pity[logModalBanner].totalWishes || 0) + 1
              }
            },
            history: [
              {
                id: Date.now().toString(),
                banner: logModalBanner,
                item: selectedItem,
                rarity,
                pity: pityAtPull,
                date: new Date().toISOString().slice(0, 10)
              },
              ...p.history
            ]
          }), `Logged ${rarity}★ ${selectedItem}!`);
          setLogModalBanner(null);
        };

        return (
          <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
            <div className="bg-gt-card border border-gt-border rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
              <div className="flex justify-between items-center border-b border-gt-border pb-3">
                <h3 className="text-lg font-black text-gt-gold">Log Specific Wish Result</h3>
                <button onClick={() => setLogModalBanner(null)} className="text-gt-subtext hover:text-gt-text">✕</button>
              </div>

              <form onSubmit={handleSave} className="space-y-4 text-xs font-bold">
                <div>
                  <label className="text-gt-subtext block mb-1">Rarity</label>
                  <div className="flex gap-2">
                    {[5, 4, 3].map(r => (
                      <button 
                        type="button" 
                        key={r}
                        onClick={() => setRarity(r)}
                        className={`flex-1 py-2 rounded-xl border transition ${rarity === r ? 'bg-gt-gold text-black border-gt-gold' : 'bg-gt-raised border-gt-border text-gt-subtext'}`}
                      >
                        {r}★
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-gt-subtext block mb-1">Item Name</label>
                  <select 
                    value={selectedItem} 
                    onChange={e => setSelectedItem(e.target.value)}
                    className="w-full bg-gt-raised border border-gt-border rounded-xl p-2.5 text-gt-text font-bold focus:outline-none"
                  >
                    {CHARACTER_DATABASE.map(c => <option key={c.id} value={c.name}>{c.name} ({c.element})</option>)}
                    {WEAPON_DATABASE.map(w => <option key={w.id} value={w.name}>{w.name} ({w.type})</option>)}
                  </select>
                </div>

                <div>
                  <label className="text-gt-subtext block mb-1">Pity at Pull</label>
                  <input 
                    type="number" 
                    value={pityAtPull} 
                    onChange={e => setPityAtPull(parseInt(e.target.value) || 1)}
                    className="w-full bg-gt-raised border border-gt-border rounded-xl p-2.5 text-gt-gold font-bold focus:outline-none"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="submit" className="flex-1 py-3 bg-gt-gold text-black font-extrabold rounded-xl hover:opacity-90 transition">
                    Save Wish Pull
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col pb-20 md:pb-6">
          {/* Header Navigation */}
          <header className="sticky top-0 z-40 bg-gt-bg/90 backdrop-blur-md border-b border-gt-border py-3 px-4 sm:px-8">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-gt-gold to-gt-warmGold flex items-center justify-center text-black font-black text-xl shadow-lg glow-gold">
                  ✦
                </div>
                <div>
                  <h1 className="text-xl font-black font-genshin text-gradient-gold tracking-wide leading-none">Genshin Track</h1>
                  <span className="text-[10px] font-bold text-gt-subtext tracking-widest uppercase">Genshin Impact Companion</span>
                </div>
              </div>

              {/* Top Navigation Links */}
              <nav className="hidden md:flex items-center gap-1 bg-gt-sec p-1 rounded-2xl border border-gt-border">
                {[
                  { id: 'home', label: 'Home' },
                  { id: 'pity', label: 'Pity' },
                  { id: 'history', label: 'History' },
                  { id: 'planner', label: 'Planner' },
                  { id: 'materials', label: 'Materials' },
                  { id: 'todo', label: 'To-do' },
                  { id: 'characters', label: 'Characters' },
                  { id: 'wishlist', label: 'Wishlist' }
                ].map(t => (
                  <button 
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition ${activeTab === t.id ? 'bg-gt-gold text-black shadow-md' : 'text-gt-subtext hover:text-gt-text'}`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setIsSearchOpen(true)}
                  className="p-2 bg-gt-card border border-gt-border hover:border-gt-gold rounded-xl text-gt-subtext hover:text-gt-text text-xs font-bold transition"
                  title="Search"
                >
                  🔍
                </button>
                <button 
                  onClick={() => setActiveTab('settings')}
                  className="p-2 bg-gt-card border border-gt-border hover:border-gt-gold rounded-xl text-gt-subtext hover:text-gt-text text-xs font-bold transition"
                  title="Settings"
                >
                  ⚙️
                </button>
              </div>
            </div>
          </header>

          {/* Main Content View Container */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">
            {activeTab === 'home' && renderHomeTab()}
            {activeTab === 'pity' && renderPityTab()}
            {activeTab === 'history' && renderHistoryTab()}
            {activeTab === 'planner' && renderPlannerTab()}
            {activeTab === 'materials' && renderMaterialsTab()}
            {activeTab === 'todo' && renderTodoTab()}
            {activeTab === 'characters' && renderCharactersTab()}
            {activeTab === 'wishlist' && renderWishlistTab()}
            {activeTab === 'settings' && renderSettingsTab()}
          </main>

          {/* Mobile Bottom Navigation Bar */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-gt-sec/95 backdrop-blur-md border-t border-gt-border p-2 z-40 flex justify-around items-center">
            {[
              { id: 'pity', label: 'Pity', icon: '✨' },
              { id: 'home', label: 'Home', icon: '🏠' },
              { id: 'planner', label: 'Planner', icon: '💎' },
              { id: 'materials', label: 'Materials', icon: '🌙' },
              { id: 'todo', label: 'To-do', icon: '📋' },
              { id: 'history', label: 'History', icon: '📜' }
            ].map(m => (
              <button 
                key={m.id}
                onClick={() => setActiveTab(m.id)}
                className={`flex flex-col items-center gap-0.5 p-1 rounded-xl transition ${activeTab === m.id ? 'text-gt-gold' : 'text-gt-subtext'}`}
              >
                <span className="text-base">{m.icon}</span>
                <span className="text-[10px] font-bold">{m.label}</span>
              </button>
            ))}
          </nav>

          {/* Toast Message Container */}
          {toastMessage && (
            <div className="fixed bottom-16 md:bottom-6 right-6 bg-gt-gold text-black font-black text-xs px-4 py-2.5 rounded-2xl shadow-2xl z-50 animate-bounceSlow">
              ✦ {toastMessage}
            </div>
          )}

          {/* Log Pull Modal */}
          {renderLogModal()}
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
