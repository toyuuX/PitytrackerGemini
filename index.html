    :root {

      --bg-card: #131B3B;
      --bg-raised: #1A2448;
      --border-color: #2B3766;
      --accent-gold: #F0C36A;
      --accent-warm: #FFB259;
      --text-main: #E9EDFF;
      --text-sub: #AEB7DC;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Roboto', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .font-heading { font-family: 'Nunito', sans-serif; }
    .font-genshin { font-family: 'Marcellus', serif; }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0A0F23; }
    ::-webkit-scrollbar-thumb { background: #2B3766; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #F0C36A; }

    /* Animations */
    .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-bounceSlow { animation: bounce 3s infinite; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glow effects */
    .glow-gold { box-shadow: 0 0 15px rgba(240, 195, 106, 0.25); }
    .text-gradient-gold {
      background: linear-gradient(135deg, #FFF0CA 0%, #F0C36A 50%, #FFB259 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input[type=range] {
      accent-color: var(--accent-gold);
    }

                >
                  🗑️ Reset All
                </button>
              </div>
            </div>
          </div>

          <div className="space-y-5">
            {banners.map(b => {
              const pityData = appData.pity[b.key] || { count: 0, guaranteed: false };
              const isSoftPity = pityData.count >= b.softPity;
              const isHardPity = pityData.count >= b.maxPity;
              const pullsToSoft = Math.max(0, b.softPity - pityData.count);
              const pullsToHard = Math.max(0, b.maxPity - pityData.count);

              let currentRate = b.key === 'weapon' ? 0.7 : 0.6;
              if (isSoftPity) currentRate += (pityData.count - b.softPity + 1) * 6.0;
              if (isHardPity) currentRate = 100;

              const primosToSoft = pullsToSoft * 160;
              const primosToHard = pullsToHard * 160;

              return (
                <div key={b.key} className="bg-gt-card border border-gt-border hover:border-gt-gold/40 rounded-3xl p-5 shadow-xl transition relative overflow-hidden">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <span className="text-xs font-bold text-gt-subtext uppercase tracking-wider">Banner Tracker</span>
                      <h3 className="text-xl font-black font-heading text-gt-text mt-0.5">{b.name}</h3>
                    </div>
                    
                    {('guaranteed' in pityData) && (
                      <button 
                        onClick={() => mutateState(p => ({
                          ...p,
                          pity: {
                            ...p.pity,
                            [b.key]: { ...p.pity[b.key], guaranteed: !p.pity[b.key].guaranteed }
                          }
                        }), `${b.name} guarantee toggled`)}
                        className={`px-3 py-1.5 rounded-full text-xs font-extrabold border transition ${pityData.guaranteed ? 'bg-gt-gold/20 border-gt-gold text-gt-gold' : 'bg-gt-raised border-gt-border text-gt-subtext hover:border-gt-gold/50'}`}
                      >
                        {pityData.guaranteed ? '✨ Next 5★ Guaranteed' : '⚖️ 50/50 Chance'}
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5 items-center my-4">
                    <div className="text-center md:text-left">
                      <div className="text-xs font-bold text-gt-subtext">Current Pity</div>
                      <div className="text-5xl font-black font-heading text-gt-gold my-1">{pityData.count} <span className="text-lg font-normal text-gt-subtext">/ {b.maxPity}</span></div>
                      <div className="text-xs font-semibold text-gt-subtext">
                        Total Wishes Logged: <strong className="text-gt-text">{pityData.totalWishes || 0}</strong>
                      </div>
                    </div>

                    <div className="md:col-span-2 space-y-3">
                      <div className="space-y-1">
                        <div className="flex justify-between text-xs font-bold">
                          <span className={isSoftPity ? "text-gt-gold font-extrabold" : "text-gt-subtext"}>
                            {isSoftPity ? "⚡ SOFT PITY ACTIVE!" : `Soft Pity in ${pullsToSoft} wishes`}
                          </span>
                          <span className="text-gt-subtext">Hard Pity: {pullsToHard} wishes</span>
                        </div>
                        <div className="w-full h-4 bg-gt-raised border border-gt-border rounded-full p-0.5 relative overflow-hidden">
                          <div 
                            className={`h-full rounded-full transition-all duration-500 bg-gradient-to-r ${b.color}`}
                            style={{ width: `${Math.min(100, (pityData.count / b.maxPity) * 100)}%` }}
                          ></div>
                          <div 
                            className="absolute top-0 bottom-0 w-0.5 bg-gt-gold z-10 opacity-80" 
                            style={{ left: `${(b.softPity / b.maxPity) * 100}%` }}
                            title="Soft Pity Threshold"
                          ></div>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-2 text-center">
                        <div className="bg-gt-raised p-2 rounded-xl border border-gt-border/40">
                          <div className="text-[10px] font-bold text-gt-subtext">Next Pull Chance</div>
                          <div className="text-sm font-extrabold text-gt-gold">{currentRate.toFixed(1)}%</div>
                        </div>
                        <div className="bg-gt-raised p-2 rounded-xl border border-gt-border/40">
                          <div className="text-[10px] font-bold text-gt-subtext">To Soft Pity</div>
                          <div className="text-sm font-extrabold text-gt-text">{primosToSoft} 💎</div>
                        </div>
                        <div className="bg-gt-raised p-2 rounded-xl border border-gt-border/40">
                          <div className="text-[10px] font-bold text-gt-subtext">To Guaranteed</div>
                          <div className="text-sm font-extrabold text-gt-warmGold">{primosToHard} 💎</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 mt-4 pt-3 border-t border-gt-border/50">
                    <button 
                      onClick={() => mutateState(p => ({
                        ...p,
                        pity: {
                          ...p.pity,
                          [b.key]: {
                            ...p.pity[b.key],
                            count: p.pity[b.key].count + 1,
                            totalWishes: (p.pity[b.key].totalWishes || 0) + 1
                          }
                        }
                      }), `+1 Pull on ${b.name}`)}
                      className="flex-1 min-w-[100px] py-2.5 bg-gradient-to-r from-gt-gold to-gt-warmGold text-black font-extrabold text-xs rounded-xl hover:opacity-90 transition active:scale-95 shadow-md"
                    >
                      +1 Wish
                    </button>

                    <button 
                      onClick={() => mutateState(p => ({
                        ...p,
                        pity: {
                          ...p.pity,
                          [b.key]: {
                            ...p.pity[b.key],
                            count: p.pity[b.key].count + 10,
                            totalWishes: (p.pity[b.key].totalWishes || 0) + 10
                          }
                        }
                      }), `+10 Pulls on ${b.name}`)}
                      className="flex-1 min-w-[100px] py-2.5 bg-gt-raised border border-gt-gold text-gt-gold font-extrabold text-xs rounded-xl hover:bg-gt-gold hover:text-black transition active:scale-95 shadow-md"
                    >
                      +10 Wishes
                    </button>

                    <button 
                      onClick={() => setLogModalBanner(b.key)}
                      className="py-2.5 px-4 bg-gt-raised border border-gt-border hover:border-gt-gold text-gt-subtext hover:text-gt-text font-bold text-xs rounded-xl transition"
                    >
                      ⭐ Log 4★/5★
                    </button>

                    <button 
                      onClick={() => {
                        setConfirmModal({
                          title: `Reset Counter for ${b.name}?`,
                          message: "Are you sure you want to reset this banner's pity back to 0?",
                          onConfirm: () => {
                            mutateState(p => ({
                              ...p,
                              pity: { ...p.pity, [b.key]: { ...p.pity[b.key], count: 0 } }
                            }), `${b.name} reset`);
                            setConfirmModal(null);
                          }
                        });
                      }}
                      className="py-2.5 px-3 bg-red-500/10 border border-red-500/20 hover:border-red-500 text-red-400 rounded-xl text-xs font-bold transition"
                      title="Reset Counter"
                    >
                      ↺
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // 3. WISH HISTORY TAB

    // 4. SAVINGS PLANNER TAB (INDEPENDENT COMPONENT)
    function PlannerTab({ appData, mutateState }) {
      const [targetDate, setTargetDate] = useState(() => {
        const d = new Date();
        d.setDate(d.getDate() + 30);
        return d.toISOString().slice(0, 10);
      });

      const [welkin, setWelkin] = useState(appData.settings.welkinActive || false);
      const [abyssRuns, setAbyssRuns] = useState(1);
      const [selectedGoalId, setSelectedGoalId] = useState('custom');
      const [customWishGoal, setCustomWishGoal] = useState(90);

      const currentPrimos = appData.savings.primogems || 0;
      const currentFates = appData.savings.fatesIntertwined || 0;
      const currentStarglitter = appData.savings.starglitter || 0;

      const daysRemaining = Math.max(1, Math.ceil((new Date(targetDate) - new Date()) / (1000 * 60 * 60 * 24)));
      const dailyPrimos = 60 + (welkin ? 90 : 0);
      const projectedDailyPrimos = daysRemaining * dailyPrimos;
      const projectedAbyssPrimos = abyssRuns * 600;
      
      const totalProjectedPrimos = currentPrimos + projectedDailyPrimos + projectedAbyssPrimos;
      const totalProjectedWishes = Math.floor(totalProjectedPrimos / 160) + currentFates + Math.floor(currentStarglitter / 5);

      let targetWishesNeeded = customWishGoal;
      if (selectedGoalId !== 'custom') {
        const selectedGoal = (appData.wishlist || []).find(w => w.id === selectedGoalId);
        if (selectedGoal) targetWishesNeeded = selectedGoal.wishBudget || 90;
      }

      const shortfallWishes = Math.max(0, targetWishesNeeded - totalProjectedWishes);
      const extraPrimosNeeded = shortfallWishes * 160;
      const extraPrimosDailyNeeded = Math.ceil(extraPrimosNeeded / daysRemaining);

      return (
        <div className="space-y-5 animate-slideUp">
          <h2 className="text-2xl font-bold font-heading text-gt-gold">Savings & Banner Planner</h2>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-gt-card border border-gt-border rounded-2xl p-4 space-y-4 shadow-lg">
              <h3 className="text-sm font-extrabold text-gt-gold uppercase tracking-wider">Planner Inputs</h3>

              <div>
                <label className="text-xs font-bold text-gt-subtext block mb-1">Target Banner End Date</label>
                <input 
                  type="date" 
                  value={targetDate} 
                  onChange={e => setTargetDate(e.target.value)}
                  className="w-full bg-gt-raised border border-gt-border rounded-xl p-2.5 text-xs font-bold text-gt-text focus:outline-none focus:border-gt-gold"
                />
                <span className="text-[10px] text-gt-subtext mt-1 block">{daysRemaining} days remaining</span>
              </div>

              <div>
                <label className="text-xs font-bold text-gt-subtext block mb-1">Select Target Goal</label>
                <select 
                  value={selectedGoalId} 
                  onChange={e => setSelectedGoalId(e.target.value)}
                  className="w-full bg-gt-raised border border-gt-border rounded-xl p-2.5 text-xs font-bold text-gt-text focus:outline-none focus:border-gt-gold"
                >
                  <option value="custom">Custom Wish Goal</option>
                  {(appData.wishlist || []).map(w => (
                    <option key={w.id} value={w.id}>{w.name} ({w.wishBudget || 90} Wishes)</option>
                  ))}
                </select>
              </div>

              {selectedGoalId === 'custom' && (
                <div>
                  <label className="text-xs font-bold text-gt-subtext block mb-1">Wish Goal Count</label>
                  <input 
                    type="number" 
                    min="1" 
                    value={customWishGoal} 
                    onChange={e => setCustomWishGoal(parseInt(e.target.value) || 1)}
                    className="w-full bg-gt-raised border border-gt-border rounded-xl p-2 text-xs font-bold text-gt-gold focus:outline-none"
                  />
                </div>
              )}

              <div className="space-y-2 pt-2 border-t border-gt-border">
                <div className="flex items-center justify-between bg-gt-raised p-2.5 rounded-xl border border-gt-border">
                  <div>
                    <div className="text-xs font-bold text-gt-text">Welkin Moon</div>
                    <div className="text-[10px] text-gt-subtext">+90 Primos daily</div>
                  </div>
                  <input 
                    type="checkbox" 
                    checked={welkin} 
                    onChange={e => {
                      setWelkin(e.target.checked);
                      mutateState(p => ({ ...p, settings: { ...p.settings, welkinActive: e.target.checked } }));
                    }}
                    className="w-4 h-4 accent-gt-gold"
                  />
                </div>

                <div className="flex justify-between items-center bg-gt-raised p-2.5 rounded-xl border border-gt-border">
                  <div className="text-xs font-bold text-gt-text">Spiral Abyss Clears</div>
                  <input 
                    type="number" 
                    min="0" 
                    max="10" 
                    value={abyssRuns} 
                    onChange={e => setAbyssRuns(parseInt(e.target.value) || 0)}
                    className="w-16 bg-gt-card border border-gt-border rounded-lg p-1 text-center font-bold text-gt-gold"
                  />
                </div>
              </div>

              <div className="space-y-2 pt-2 border-t border-gt-border">
                <div className="text-xs font-bold text-gt-subtext">Current Vault Inventory</div>
                <div className="flex justify-between items-center text-xs">
                  <span className="flex items-center gap-1"><MaterialIcon type="primogem" className="w-5 h-5" /> Primogems:</span>
                  <input 
                    type="number" 
                    min="0"
                    value={appData.savings.primogems || 0} 
                    onChange={e => mutateState(p => ({ ...p, savings: { ...p.savings, primogems: parseInt(e.target.value) || 0 } }))}
                    className="w-24 bg-gt-raised border border-gt-border rounded-lg p-1 text-right font-bold text-gt-gold"
                  />
                </div>
                <div className="flex justify-between items-center text-xs">
                  <span className="flex items-center gap-1"><MaterialIcon type="intertwined" className="w-5 h-5" /> Fates:</span>
                  <input 
                    type="number" 
                    min="0"
                    value={appData.savings.fatesIntertwined || 0} 
                    onChange={e => mutateState(p => ({ ...p, savings: { ...p.savings, fatesIntertwined: parseInt(e.target.value) || 0 } }))}
                    className="w-24 bg-gt-raised border border-gt-border rounded-lg p-1 text-right font-bold text-gt-r5"
                  />
                </div>
              </div>
            </div>

            <div className="bg-gt-card border border-gt-border rounded-2xl p-5 shadow-lg md:col-span-2 flex flex-col justify-between">
              <div>
                <div className="text-xs font-bold text-gt-subtext uppercase tracking-wider">Projected Outcome</div>
                <div className="text-3xl font-black text-gradient-gold my-2">
                  {totalProjectedWishes} <span className="text-sm font-normal text-gt-subtext">Total Wishes Available by Target Date</span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 my-4">
                  <div className="bg-gt-raised p-3 rounded-xl border border-gt-border/50">
                    <div className="text-[10px] text-gt-subtext font-bold">Estimated Total Primos</div>
                    <div className="text-base font-extrabold text-gt-gold">{totalProjectedPrimos.toLocaleString()} 💎</div>
                  </div>
                  <div className="bg-gt-raised p-3 rounded-xl border border-gt-border/50">
                    <div className="text-[10px] text-gt-subtext font-bold">Goal Wish Need</div>
                    <div className="text-base font-extrabold text-gt-warmGold">{targetWishesNeeded} Wishes</div>
                  </div>
                  <div className="bg-gt-raised p-3 rounded-xl border border-gt-border/50 col-span-2 sm:col-span-1">
                    <div className="text-[10px] text-gt-subtext font-bold">Daily Primo Yield</div>
                    <div className="text-base font-extrabold text-gt-hydro">{dailyPrimos} / day</div>
                  </div>
                </div>

                <div className={`p-4 rounded-xl border font-bold text-xs ${shortfallWishes === 0 ? 'bg-green-500/10 border-green-500/30 text-green-400' : 'bg-red-500/10 border-red-500/30 text-red-400'}`}>
                  {shortfallWishes === 0 ? (
                    <div>🎉 Target Achievable! You are projected to have enough wishes for your goal by {targetDate}.</div>
                  ) : (
                    <div>⚠️ Shortfall of {shortfallWishes} wishes ({extraPrimosNeeded} Primogems). You need ~{extraPrimosDailyNeeded} extra Primogems daily from events or exploration.</div>
                  )}
                </div>
              </div>

              <div className="text-[11px] text-gt-subtext mt-4">
                * Daily yield includes Daily Commissions (60) + Welkin Moon (90) if active. Spiral Abyss and events provide additional rewards.
              </div>
            </div>
          </div>
        </div>
      );
    }

                  <MaterialIcon type="fragileResin" className="w-4 h-4" /> +60 Fragile

                <button 
                  onClick={() => mutateState(p => ({ ...p, resin: { ...p.resin, current: 200 } }), "Resin set to Max")}

                >
                  Max (200)

              </div>
            </div>
          </div>

          <div className="bg-gt-card border border-gt-border rounded-2xl p-5 shadow-lg space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="text-base font-extrabold text-gt-gold">⚔️ Today's Farmable Domains ({todaySchedule.name})</h3>
              <span className="text-xs px-2.5 py-1 bg-gt-raised rounded-full text-gt-subtext border border-gt-border font-bold">Server Day</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-gt-raised p-4 rounded-xl border border-gt-border/50">
                <div className="text-xs font-bold text-gt-warmGold uppercase mb-2">Talent Level-Up Books</div>
                <div className="flex flex-wrap gap-2">
                  {todaySchedule.talents.map((t, idx) => (
                    <span key={idx} className="px-2.5 py-1 bg-gt-card border border-gt-border rounded-lg text-xs font-bold text-gt-text">
                      {t}
                    </span>
                  ))}
                </div>
              </div>

              <div className="bg-gt-raised p-4 rounded-xl border border-gt-border/50">
                <div className="text-xs font-bold text-gt-hydro uppercase mb-2">Weapon Ascension Materials</div>

    // 6. TO-DO CHECKLIST TAB (INDEPENDENT COMPONENT)
    // 7. CHARACTERS TAB & BUILDER COMPONENT
    function CharactersTab({ appData, mutateState }) {
      const [filterElement, setFilterElement] = useState('all');
      const [filterWeapon, setFilterWeapon] = useState('all');
      const [filterOwned, setFilterOwned] = useState('all');
      const [filterRarity, setFilterRarity] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('rarity');
      const [editingChar, setEditingChar] = useState(null);

      // Default structure for unconfigured characters
      const getProgression = useCallback((charId) => {
        const defaultChar = CHARACTER_DATABASE.find(c => c.id === charId);
        const matchingWeapon = WEAPON_DATABASE.find(w => w.type === defaultChar?.weapon) || WEAPON_DATABASE[0];
        
        return (appData.characterProgress && appData.characterProgress[charId]) || {
          owned: false,
          level: 1,
          constellation: 0,
          weaponId: matchingWeapon?.id || '',
          weaponLevel: 1,
          refinement: 1,
          talents: { normal: 1, skill: 1, burst: 1 },
          notes: ''
        };
      }, [appData.characterProgress]);

      // Filter and sort roster
      const filteredCharacters = useMemo(() => {
        return CHARACTER_DATABASE.filter(c => {
          const prog = getProgression(c.id);
          if (filterElement !== 'all' && c.element.toLowerCase() !== filterElement) return false;
          if (filterWeapon !== 'all' && c.weapon.toLowerCase() !== filterWeapon) return false;
          if (filterRarity !== 'all' && c.rarity !== parseInt(filterRarity)) return false;
          if (filterOwned === 'owned' && !prog.owned) return false;
          if (filterOwned === 'unowned' && prog.owned) return false;
          if (searchQuery.trim() && !c.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        }).sort((a, b) => {
          const progA = getProgression(a.id);
          const progB = getProgression(b.id);
          if (sortBy === 'rarity') {
            if (b.rarity !== a.rarity) return b.rarity - a.rarity;
            return a.name.localeCompare(b.name);
          }
          if (sortBy === 'level') return progB.level - progA.level;
          if (sortBy === 'constellation') return progB.constellation - progA.constellation;
          return a.name.localeCompare(b.name);
        });
      }, [filterElement, filterWeapon, filterOwned, filterRarity, searchQuery, sortBy, getProgression]);

      const ownedCount = useMemo(() => {
        return Object.values(appData.characterProgress || {}).filter(p => p.owned).length;
      }, [appData.characterProgress]);

      const maxLevelCount = useMemo(() => {
        return Object.values(appData.characterProgress || {}).filter(p => p.owned && p.level === 90).length;
      }, [appData.characterProgress]);

      const c6Count = useMemo(() => {
        return Object.values(appData.characterProgress || {}).filter(p => p.owned && p.constellation === 6).length;
      }, [appData.characterProgress]);

      return (
        <div className="space-y-5 animate-slideUp">
          {/* Header & Overview Stats */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 className="text-2xl font-bold font-heading text-gt-gold">Character Roster & Builder</h2>
              <p className="text-xs text-gt-subtext">Manage weapons, levels, constellations, and talents for every character</p>
            </div>

            <div className="flex items-center gap-2 bg-gt-card border border-gt-border px-3 py-1.5 rounded-2xl text-xs">
              <span className="font-bold text-gt-gold">{ownedCount} / {CHARACTER_DATABASE.length} Owned</span>
              <span className="text-gt-border">|</span>
              <span className="text-gt-subtext">{maxLevelCount} Max Lvl 90</span>
              <span className="text-gt-border">|</span>
              <span className="text-gt-subtext">{c6Count} C6</span>
            </div>
          </div>

          {/* Search & Filter Bar */}
          <div className="bg-gt-card border border-gt-border rounded-2xl p-4 shadow-lg space-y-3">
            <div className="flex flex-wrap sm:flex-nowrap gap-2">
              <div className="relative flex-1">
                <input 
                  type="text"
                  placeholder="Search character name..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full bg-gt-raised border border-gt-border rounded-xl pl-9 pr-3 py-2 text-xs font-bold text-gt-text focus:outline-none focus:border-gt-gold"
                />
                <span className="absolute left-3 top-2.5 text-xs text-gt-subtext">🔍</span>
              </div>

              <select 
                value={sortBy}
                onChange={e => setSortBy(e.target.value)}
                className="bg-gt-raised border border-gt-border rounded-xl px-3 py-2 text-xs font-bold text-gt-subtext focus:outline-none"
              >
                <option value="rarity">Sort by Rarity</option>
                <option value="name">Sort by Name</option>
                <option value="level">Sort by Level</option>
                <option value="constellation">Sort by Constellation</option>
              </select>

              <select 
                value={filterOwned}
                onChange={e => setFilterOwned(e.target.value)}
                className="bg-gt-raised border border-gt-border rounded-xl px-3 py-2 text-xs font-bold text-gt-subtext focus:outline-none"
              >
                <option value="all">All Status</option>
                <option value="owned">Owned Only</option>
                <option value="unowned">Unowned Only</option>
              </select>
            </div>

            {/* Element Filter Pills */}
            <div className="flex flex-wrap gap-1.5 pt-1">
              {['all', 'pyro', 'hydro', 'anemo', 'electro', 'dendro', 'cryo', 'geo'].map(el => (
                <button 
                  key={el}
                  onClick={() => setFilterElement(el)}
                  className={`px-3 py-1 rounded-xl text-xs font-extrabold capitalize transition ${filterElement === el ? 'bg-gt-gold text-black shadow-md' : 'bg-gt-raised border border-gt-border/60 text-gt-subtext hover:text-gt-text'}`}
                >
                  {el}
                </button>
              ))}

              <div className="h-4 w-[1px] bg-gt-border self-center mx-1"></div>

              {['all', 'sword', 'claymore', 'polearm', 'bow', 'catalyst'].map(w => (
                <button 
                  key={w}
                  onClick={() => setFilterWeapon(w)}
                  className={`px-2.5 py-1 rounded-xl text-xs font-extrabold capitalize transition ${filterWeapon === w ? 'bg-gt-warmGold text-black shadow-md' : 'bg-gt-raised border border-gt-border/60 text-gt-subtext hover:text-gt-text'}`}
                >
                  {w}
                </button>
              ))}
            </div>
          </div>

          {/* Character Grid Roster */}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            {filteredCharacters.length === 0 ? (
              <div className="col-span-full bg-gt-card border border-gt-border rounded-2xl p-10 text-center text-gt-subtext text-xs space-y-2">
                <div className="text-3xl">🔍</div>
                <div className="font-bold">No characters match your current filters</div>
                <div>Try adjusting element, weapon type, or search queries!</div>
              </div>
            ) : (
              filteredCharacters.map(char => {
                const prog = getProgression(char.id);
                const equippedWeapon = WEAPON_DATABASE.find(w => w.id === prog.weaponId);

                return (
                  <div 
                    key={char.id} 
                    className={`bg-gt-card border hover:border-gt-gold/80 rounded-2xl p-3.5 shadow-md transition flex flex-col justify-between relative overflow-hidden ${prog.owned ? 'border-gt-border' : 'border-gt-border/40 opacity-70 hover:opacity-100'}`}
                  >
                    {/* Character Card Header */}
                    <div>
                      <div className="flex items-start gap-3">
                        <CharacterIcon character={char} className="w-14 h-14" />
                        <div className="flex-1 min-w-0">
                          <div className="flex justify-between items-start">
                            <h3 className="text-xs font-black text-gt-text truncate">{char.name}</h3>
                            <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded ${prog.owned ? 'bg-gt-gold/20 text-gt-gold border border-gt-gold/40' : 'bg-gt-raised text-gt-subtext'}`}>
                              {prog.owned ? `C${prog.constellation}` : 'Unowned'}
                            </span>
                          </div>
                          
                          <div className="text-[10px] font-bold text-gt-subtext capitalize mt-0.5">
                            {char.element} • {char.weapon}
                          </div>

                          {prog.owned && (
                            <div className="mt-1.5 flex items-center gap-1">
                              <span className="text-[10px] font-black px-1.5 py-0.2 bg-gt-raised border border-gt-border rounded text-gt-gold">
                                Lvl {prog.level}
                              </span>
                              <span className="text-[9px] text-gt-subtext font-semibold">
                                T: {prog.talents?.normal || 1}/{prog.talents?.skill || 1}/{prog.talents?.burst || 1}
                              </span>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Equipped Weapon Info */}
                      {prog.owned && (
                        <div className="mt-3 p-2 bg-gt-raised/80 rounded-xl border border-gt-border/50 text-[10px]">
                          <div className="flex justify-between items-center text-gt-subtext">
                            <span className="font-bold text-gt-text truncate">{equippedWeapon?.name || 'No Weapon'}</span>
                            <span className="text-gt-warmGold font-extrabold ml-1">R{prog.refinement || 1}</span>
                          </div>
                          <div className="text-[9px] text-gt-subtext mt-0.5">
                            Weapon Lvl {prog.weaponLevel || 1} / 90
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Quick Action Button */}
                    <button 
                      onClick={() => setEditingChar(char)}
                      className="mt-3 w-full py-1.5 bg-gt-raised hover:bg-gt-gold hover:text-black border border-gt-border text-gt-gold font-extrabold text-xs rounded-xl transition flex items-center justify-center gap-1"
                    >
                      <span>⚙️</span> {prog.owned ? 'Edit Build & Stats' : 'Mark Owned / Build'}
                    </button>
                  </div>
                );
              })
            )}
          </div>

          {/* Character Build & Stats Modal */}
          {editingChar && (
            <CharacterDetailModal 
              character={editingChar}
              progression={getProgression(editingChar.id)}
              onClose={() => setEditingChar(null)}
              onSave={(updatedProg) => {
                mutateState(p => ({
                  ...p,
                  characterProgress: {
                    ...(p.characterProgress || {}),
                    [editingChar.id]: updatedProg
                  }
                }), `Updated ${editingChar.name} build!`);
                setEditingChar(null);
              }}
            />
          )}
        </div>
      );
    }

    // --- CHARACTER DETAIL & BUILD MODAL COMPONENT ---
    function CharacterDetailModal({ character, progression, onClose, onSave }) {
      const [owned, setOwned] = useState(progression.owned);
      const [level, setLevel] = useState(progression.level || 1);
      const [constellation, setConstellation] = useState(progression.constellation || 0);
      const [weaponId, setWeaponId] = useState(progression.weaponId || '');
      const [weaponLevel, setWeaponLevel] = useState(progression.weaponLevel || 1);
      const [refinement, setRefinement] = useState(progression.refinement || 1);
      const [talents, setTalents] = useState(progression.talents || { normal: 1, skill: 1, burst: 1 });
      const [notes, setNotes] = useState(progression.notes || '');

      // Compatible weapons filtered by character weapon type
      const compatibleWeapons = useMemo(() => {
        return WEAPON_DATABASE.filter(w => w.type.toLowerCase() === character.weapon.toLowerCase());
      }, [character]);

      useEffect(() => {
        if (!weaponId && compatibleWeapons.length > 0) {
          setWeaponId(compatibleWeapons[0].id);
        }
      }, [weaponId, compatibleWeapons]);

      const handleSave = (e) => {
        e.preventDefault();
        onSave({
          owned,
          level: parseInt(level) || 1,
          constellation: parseInt(constellation) || 0,
          weaponId,
          weaponLevel: parseInt(weaponLevel) || 1,
          refinement: parseInt(refinement) || 1,
          talents: {
            normal: Math.max(1, Math.min(13, parseInt(talents.normal) || 1)),
            skill: Math.max(1, Math.min(13, parseInt(talents.skill) || 1)),
            burst: Math.max(1, Math.min(13, parseInt(talents.burst) || 1))
          },
          notes
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto animate-fadeIn">
          <div className="bg-gt-card border border-gt-border rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-5 my-8">
            {/* Modal Header */}
            <div className="flex justify-between items-center border-b border-gt-border pb-3">
              <div className="flex items-center gap-3">
                <CharacterIcon character={character} className="w-12 h-12" />
                <div>
                  <h3 className="text-lg font-black text-gt-gold">{character.name}</h3>
                  <p className="text-xs text-gt-subtext capitalize">{character.rarity}★ {character.element} • {character.weapon} ({character.region})</p>
                </div>
              </div>
              <button onClick={onClose} className="text-gt-subtext hover:text-gt-text text-lg">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-4 text-xs font-bold">
              {/* Ownership Switch */}
              <div className="flex items-center justify-between bg-gt-raised p-3 rounded-2xl border border-gt-border">
                <div>
                  <div className="text-xs font-bold text-gt-text">Ownership Status</div>
                  <div className="text-[10px] text-gt-subtext">Toggle whether this character is unlocked on your account</div>
                </div>
                <button 
                  type="button"
                  onClick={() => setOwned(!owned)}
                  className={`px-4 py-2 rounded-xl font-extrabold border transition ${owned ? 'bg-gt-gold text-black border-gt-gold' : 'bg-gt-card text-gt-subtext border-gt-border'}`}
                >
                  {owned ? '✅ Owned' : '❌ Unowned'}
                </button>
              </div>

              {owned && (
                <>
                  {/* Character Level & Presets */}
                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center">
                      <label className="text-gt-subtext">Character Level</label>
                      <span className="text-gt-gold font-extrabold text-sm">Lvl {level} / 90</span>
                    </div>
                    <input 
                      type="range"
                      min="1"
                      max="90"
                      value={level}
                      onChange={e => setLevel(parseInt(e.target.value))}
                      className="w-full accent-gt-gold"
                    />
                    <div className="flex gap-1.5 pt-1">
                      {[20, 50, 70, 80, 90].map(lvl => (
                        <button 
                          type="button"
                          key={lvl}
                          onClick={() => setLevel(lvl)}
                          className={`flex-1 py-1 rounded-lg border text-[10px] font-bold transition ${level === lvl ? 'bg-gt-gold text-black border-gt-gold' : 'bg-gt-raised border-gt-border text-gt-subtext'}`}
                        >
                          Lvl {lvl}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Constellations */}
                  <div className="space-y-1.5">
                    <label className="text-gt-subtext block">Constellation Level</label>
                    <div className="grid grid-cols-7 gap-1">
                      {[0, 1, 2, 3, 4, 5, 6].map(c => (
                        <button 
                          type="button"
                          key={c}
                          onClick={() => setConstellation(c)}
                          className={`py-2 rounded-xl border text-center font-extrabold transition ${constellation === c ? 'bg-gt-gold text-black border-gt-gold shadow-md' : 'bg-gt-raised border-gt-border text-gt-subtext'}`}
                        >
                          C{c}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Equipped Weapon Section */}
                  <div className="bg-gt-raised p-3 rounded-2xl border border-gt-border space-y-3">
                    <div className="text-xs font-extrabold text-gt-warmGold uppercase tracking-wider">Equipped Weapon</div>
                    
                    <div>
                      <label className="text-gt-subtext block mb-1">Select {character.weapon}</label>
                      <select 
                        value={weaponId}
                        onChange={e => setWeaponId(e.target.value)}
                        className="w-full bg-gt-card border border-gt-border rounded-xl p-2.5 text-gt-text font-bold focus:outline-none"
                      >
                        {compatibleWeapons.map(w => (
                          <option key={w.id} value={w.id}>{w.rarity}★ {w.name}</option>
                        ))}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-gt-subtext block mb-1">Weapon Level</label>
                        <input 
                          type="number"
                          min="1"
                          max="90"
                          value={weaponLevel}
                          onChange={e => setWeaponLevel(parseInt(e.target.value) || 1)}
                          className="w-full bg-gt-card border border-gt-border rounded-xl p-2 text-center text-gt-gold font-bold focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="text-gt-subtext block mb-1">Refinement</label>
                        <select 
                          value={refinement}
                          onChange={e => setRefinement(parseInt(e.target.value))}
                          className="w-full bg-gt-card border border-gt-border rounded-xl p-2 text-center text-gt-warmGold font-bold focus:outline-none"
                        >
                          {[1, 2, 3, 4, 5].map(r => (
                            <option key={r} value={r}>R{r}</option>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>

                  {/* Talent Levels */}
                  <div className="space-y-2">
                    <label className="text-gt-subtext block">Talent Levels (Normal / Skill / Burst)</label>
                    <div className="grid grid-cols-3 gap-2">
                      <div className="bg-gt-raised p-2 rounded-xl border border-gt-border text-center space-y-1">
                        <span className="text-[10px] text-gt-subtext block">Normal Attack</span>
                        <input 
                          type="number" 
                          min="1" 
                          max="13" 
                          value={talents.normal} 
                          onChange={e => setTalents({ ...talents, normal: parseInt(e.target.value) || 1 })}
                          className="w-full bg-gt-card border border-gt-border rounded-lg p-1 text-center font-black text-gt-text"
                        />
                      </div>

                      <div className="bg-gt-raised p-2 rounded-xl border border-gt-border text-center space-y-1">
                        <span className="text-[10px] text-gt-subtext block">Elemental Skill</span>
                        <input 
                          type="number" 
                          min="1" 
                          max="13" 
                          value={talents.skill} 
                          onChange={e => setTalents({ ...talents, skill: parseInt(e.target.value) || 1 })}
                          className="w-full bg-gt-card border border-gt-border rounded-lg p-1 text-center font-black text-gt-text"
                        />
                      </div>

                      <div className="bg-gt-raised p-2 rounded-xl border border-gt-border text-center space-y-1">
                        <span className="text-[10px] text-gt-subtext block">Elemental Burst</span>
                        <input 
                          type="number" 
                          min="1" 
                          max="13" 
                          value={talents.burst} 
                          onChange={e => setTalents({ ...talents, burst: parseInt(e.target.value) || 1 })}
                          className="w-full bg-gt-card border border-gt-border rounded-lg p-1 text-center font-black text-gt-text"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Notes & Artifact Goals */}
                  <div>
                    <label className="text-gt-subtext block mb-1">Build Notes & Target Artifacts</label>
                    <textarea 
                      value={notes}
                      onChange={e => setNotes(e.target.value)}
                      placeholder="e.g., 4pc Emblem of Severed Fate, ER / Hydro / CRIT..."
                      rows="2"
                      className="w-full bg-gt-raised border border-gt-border rounded-xl p-2.5 text-gt-text font-bold focus:outline-none"
                    />
                  </div>
                </>
              )}

              {/* Action Buttons */}
              <div className="flex gap-2 pt-2 border-t border-gt-border">
                <button 
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-3 bg-gt-raised border border-gt-border rounded-xl text-gt-subtext font-bold"
                >
                  Cancel
                </button>
                <button 
                  type="submit"
                  className="flex-1 py-3 bg-gradient-to-r from-gt-gold to-gt-warmGold text-black font-black rounded-xl hover:opacity-90 transition shadow-lg"
                >
                  Save Character Build
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ConfirmModal({ confirmModal, setConfirmModal }) {
      if (!confirmModal) return null;
      return (
        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-gt-card border border-gt-border rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4 text-center">
            <div className="text-3xl">⚠️</div>
            <h3 className="text-base font-black text-gt-gold">{confirmModal.title}</h3>
            <p className="text-xs text-gt-subtext">{confirmModal.message}</p>

            <div className="flex gap-2 pt-2">
              <button 
                onClick={() => setConfirmModal(null)} 
                className="flex-1 py-2.5 bg-gt-raised border border-gt-border rounded-xl text-xs font-bold text-gt-subtext"
              >
                Cancel
              </button>
              <button 
                onClick={confirmModal.onConfirm} 
                className="flex-1 py-2.5 bg-red-500 text-white rounded-xl text-xs font-extrabold hover:bg-red-600 transition"
              >
                Confirm
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- ERROR BOUNDARY CLASS ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, info) {
        console.error("Uncaught Error in Genshin Track:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#0A0F23] text-[#E9EDFF] flex flex-col items-center justify-center p-6 text-center space-y-4">
              <div className="text-5xl">✦</div>
              <h1 className="text-2xl font-bold text-[#F0C36A]">Something went wrong</h1>
              <p className="text-sm text-[#AEB7DC] max-w-md">An error occurred while loading this view. Click below to reset state and reload cleanly.</p>
              <button 
                onClick={() => {
                  localStorage.removeItem('genshin_track_v3_clean');
                  window.location.reload();
                }}
                className="px-6 py-3 bg-[#F0C36A] text-black font-extrabold rounded-2xl text-xs hover:opacity-90 transition shadow-lg"
              >
                🔄 Clear Cache & Reload
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      const [appData, setAppData] = useState(() => {
        try {
          const saved = localStorage.getItem('genshin_track_v3_clean');
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              ...INITIAL_STATE,
              ...parsed,
              settings: { ...INITIAL_STATE.settings, ...(parsed.settings || {}) },
              pity: { ...INITIAL_STATE.pity, ...(parsed.pity || {}) },
              savings: { ...INITIAL_STATE.savings, ...(parsed.savings || {}) },
              resin: { ...INITIAL_STATE.resin, ...(parsed.resin || {}) },
              inventory: { ...INITIAL_STATE.inventory, ...(parsed.inventory || {}) }
            };
          }
        } catch (e) {
          console.error("Failed to load saved state", e);
        }
        return INITIAL_STATE;
      });

      const [activeTab, setActiveTab] = useState('pity');
      const [searchQuery, setSearchQuery] = useState('');
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [logModalBanner, setLogModalBanner] = useState(null);
      const [confirmModal, setConfirmModal] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [lastStateHistory, setLastStateHistory] = useState([]);

      useEffect(() => {
        try {
          localStorage.setItem('genshin_track_v3_clean', JSON.stringify(appData));
        } catch (e) {
          console.error("Failed to save data", e);
        }
      }, [appData]);

      useEffect(() => {
        const interval = setInterval(() => {
          setAppData(prev => {
            const now = Date.now();
            const elapsedMs = now - (prev.resin.lastUpdated || now);
            const resinToAdd = Math.floor(elapsedMs / (8 * 60 * 1000));
            if (resinToAdd > 0 && prev.resin.current < prev.resin.max) {
              const newResin = Math.min(prev.resin.max, prev.resin.current + resinToAdd);
              return {
                ...prev,
                resin: {
                  ...prev.resin,
                  current: newResin,
                  lastUpdated: now
                }
              };
            }
            return prev;
          });
        }, 15000);
        return () => clearInterval(interval);
      }, []);

      const showToast = useCallback((msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      }, []);

      const mutateState = useCallback((updater, toastText) => {
        setAppData(prev => {
          setLastStateHistory(h => [JSON.parse(JSON.stringify(prev)), ...h.slice(0, 5)]);
          const next = updater(prev);
          return next;
        });
        if (toastText) showToast(toastText);
      }, [showToast]);

      const handleUndo = useCallback(() => {
        if (lastStateHistory.length === 0) return;
        const previous = lastStateHistory[0];
        setAppData(previous);
        setLastStateHistory(h => h.slice(1));
        showToast("Action Undone!");
      }, [lastStateHistory, showToast]);

      const totalPrimogemsSpent = useMemo(() => {
        let count = 0;
        Object.values(appData.pity).forEach(b => {
          count += (b.totalWishes || 0) * 160;
        });
        return count;
      }, [appData.pity]);

      const totalWishesSpent = useMemo(() => {
        return Math.floor(totalPrimogemsSpent / 160);
      }, [totalPrimogemsSpent]);

      return (
        <ErrorBoundary>
          <div className="min-h-screen flex flex-col pb-20 md:pb-6">
            <header className="sticky top-0 z-40 bg-gt-bg/90 backdrop-blur-md border-b border-gt-border py-3 px-4 sm:px-8">
              <div className="max-w-6xl mx-auto flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-gt-gold to-gt-warmGold flex items-center justify-center text-black font-black text-xl shadow-lg glow-gold">
                    ✦
                  </div>
                  <div>
                    <h1 className="text-xl font-black font-genshin text-gradient-gold tracking-wide leading-none">Genshin Track</h1>
                    <span className="text-[10px] font-bold text-gt-subtext tracking-widest uppercase">Genshin Impact Companion</span>
                  </div>
                </div>

                <nav className="hidden md:flex items-center gap-1 bg-gt-sec p-1 rounded-2xl border border-gt-border">
                  {[
                    { id: 'home', label: 'Home' },
                    { id: 'pity', label: 'Pity' },
                    { id: 'history', label: 'History' },
                    { id: 'planner', label: 'Planner' },
                    { id: 'materials', label: 'Materials' },
                    { id: 'todo', label: 'To-do' },
                    { id: 'characters', label: 'Characters' },
                    { id: 'wishlist', label: 'Wishlist' }
                  ].map(t => (
                    <button 
                      key={t.id}
                      onClick={() => setActiveTab(t.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition ${activeTab === t.id ? 'bg-gt-gold text-black shadow-md' : 'text-gt-subtext hover:text-gt-text'}`}
                    >
                      {t.label}
                    </button>
                  ))}
                </nav>

                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setIsSearchOpen(true)}
                    className="p-2 bg-gt-card border border-gt-border hover:border-gt-gold rounded-xl text-gt-subtext hover:text-gt-text text-xs font-bold transition"
                    title="Universal Search"
                  >
                    🔍
                  </button>
                  <button 
                    onClick={() => setActiveTab('settings')}
                    className="p-2 bg-gt-card border border-gt-border hover:border-gt-gold rounded-xl text-gt-subtext hover:text-gt-text text-xs font-bold transition"
                    title="Settings"
                  >
                    ⚙️
                  </button>
                </div>
              </div>
            </header>

            <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">
              {activeTab === 'home' && <HomeTab appData={appData} mutateState={mutateState} setActiveTab={setActiveTab} />}
              {activeTab === 'pity' && <PityTab appData={appData} mutateState={mutateState} setConfirmModal={setConfirmModal} setLogModalBanner={setLogModalBanner} handleUndo={handleUndo} lastStateHistory={lastStateHistory} totalPrimogemsSpent={totalPrimogemsSpent} totalWishesSpent={totalWishesSpent} />}
              {activeTab === 'history' && <HistoryTab appData={appData} mutateState={mutateState} showToast={showToast} setLogModalBanner={setLogModalBanner} />}
              {activeTab === 'planner' && <PlannerTab appData={appData} mutateState={mutateState} />}
              {activeTab === 'materials' && <MaterialsTab appData={appData} mutateState={mutateState} />}
              {activeTab === 'todo' && <TodoTab appData={appData} mutateState={mutateState} />}
              {activeTab === 'characters' && <CharactersTab appData={appData} mutateState={mutateState} />}
              {activeTab === 'wishlist' && <WishlistTab appData={appData} mutateState={mutateState} />}
              {activeTab === 'settings' && <SettingsTab appData={appData} mutateState={mutateState} showToast={showToast} setConfirmModal={setConfirmModal} />}
            </main>

            <nav className="md:hidden fixed bottom-0 inset-x-0 bg-gt-sec/95 backdrop-blur-md border-t border-gt-border p-2 z-40 flex justify-around items-center">
              {[
                { id: 'pity', label: 'Pity', icon: '✨' },
                { id: 'home', label: 'Home', icon: '🏠' },
                { id: 'planner', label: 'Planner', icon: '💎' },
                { id: 'materials', label: 'Materials', icon: '🌙' },
                { id: 'todo', label: 'To-do', icon: '📋' },
                { id: 'history', label: 'History', icon: '📜' }
              ].map(m => (
                <button 
                  key={m.id}
                  onClick={() => setActiveTab(m.id)}
                  className={`flex flex-col items-center gap-0.5 p-1 rounded-xl transition ${activeTab === m.id ? 'text-gt-gold' : 'text-gt-subtext'}`}
                >
                  <span className="text-base">{m.icon}</span>
                  <span className="text-[10px] font-bold">{m.label}</span>
                </button>
              ))}
            </nav>

            {toastMessage && (
              <div className="fixed bottom-16 md:bottom-6 right-6 bg-gt-gold text-black font-black text-xs px-4 py-2.5 rounded-2xl shadow-2xl z-50 animate-bounceSlow">
                ✦ {toastMessage}
              </div>
            )}

            <SearchModal 
              isSearchOpen={isSearchOpen} 
              setIsSearchOpen={setIsSearchOpen} 
              searchQuery={searchQuery} 
              setSearchQuery={setSearchQuery} 
              appData={appData} 
              setActiveTab={setActiveTab} 
            />
            <LogModal 
              logModalBanner={logModalBanner} 
              setLogModalBanner={setLogModalBanner} 
              appData={appData} 
              mutateState={mutateState} 
            />
            <ConfirmModal 
              confirmModal={confirmModal} 
              setConfirmModal={setConfirmModal} 
            />
          </div>
        </ErrorBoundary>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
