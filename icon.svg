<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d43" />
      <stop offset="100%" stop-color="#0f1016" />
    </linearGradient>
    
    <!-- Primogem Inner Gradient -->
    <linearGradient id="gemInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    
    <!-- Primogem Outer Gradient -->
    <linearGradient id="gemOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Primogem Shape -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- Outer Star -->
    <path d="M 0 -35 L 15 -15 L 35 0 L 15 15 L 0 35 L -15 15 L -35 0 L -15 -15 Z" fill="url(#gemOuter)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Inner Star -->
    <path d="M 0 -22 L 8 -8 L 22 0 L 8 8 L 0 22 L -8 8 L -22 0 L -8 -8 Z" fill="url(#gemInner)"/>
    
    <!-- Central Highlights -->
    <path d="M 0 -22 L 8 -8 L 0 0 Z" fill="#ffffff" opacity="0.8"/>
    <path d="M -22 0 L -8 -8 L 0 0 Z" fill="#e0f2fe" opacity="0.6"/>
  </g>
</svg>